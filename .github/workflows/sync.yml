name: Force Sync from Main
on:
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Merge from Main
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Add the main repo as a remote
          git remote add upstream https://github.com/Chun11-8/growyouravatar.git
          git fetch upstream
          # Force the merge even with unrelated histories
          git merge upstream/main --allow-unrelated-histories -m "Syncing from main repo"
          git push origin main
